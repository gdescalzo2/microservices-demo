apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never drop below desired capacity during a rollout
      maxSurge: 1
  template:
    spec:
      containers:
        - name: server
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 9090
              name: metrics
          env:
            - name: METRICS_PORT
              value: "9090"
          # Startup probe: liveness only kicks in once the server is up.
          startupProbe:
            httpGet:
              path: /_healthz
              port: 8080
            periodSeconds: 2
            failureThreshold: 30
