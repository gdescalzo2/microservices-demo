# Startup probes for every upstream service with a liveness probe.
#
# With 20m CPU requests and 2 environments + monitoring on a 4 vCPU node,
# cold starts under contention take well over the upstream liveness window
# (e.g. emailservice: 3 x 5s, no initial delay). The kubelet then kills the
# container, the restart burns more CPU, and the whole node degrades.
# Observed on the first real bootstrap: emailservice and recommendationservice
# in CrashLoopBackOff (25 restarts, exit 137) in both namespaces.
#
# A startup probe gives up to 150s (30 x 5s) to come up; liveness and
# readiness only start once it succeeds, so steady-state behaviour is the
# upstream one. Same check (protocol and port) as each liveness probe.
apiVersion: apps/v1
kind: Deployment
metadata: {name: adservice}
spec:
  template:
    spec:
      containers:
        - name: server
          startupProbe: {grpc: {port: 9555}, periodSeconds: 5, failureThreshold: 30}
---
