# PROD: HA frontend (2+ replicas, PDB, HPA), read-only team access.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-prod

resources:
  - namespace.yaml
  - ../../base
  - httproute.yaml
  - rbac.yaml
  - frontend-hpa.yaml
  - frontend-pdb.yaml

components:
  - ../../components/kind-sizing
  - ../../components/observability
  - ../../components/staged-sync

labels:
  - pairs:
      platform.example.com/environment: prod
    includeSelectors: false
    includeTemplates: true

images:
  - name: boutique/frontend
    newTag: 1.3.0
  # Built from this fork (platform/scripts/build-image.sh): card declines
  # leave paymentservice and checkoutservice as a client-side error (gRPC
  # FAILED_PRECONDITION), so the frontend can answer 402 instead of 500.
  # Promoted from dev after the end-to-end check there.
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/paymentservice
    newName: boutique/paymentservice
    newTag: 1.0.2
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/checkoutservice
    newName: boutique/checkoutservice
    newTag: 1.0.0

# Non-secret, per-environment settings of the load generator. Kustomize
# appends a hash of the content to the name: changing a value renames the
# ConfigMap, so the Deployment rolls out by itself (no manual restart).
configMapGenerator:
  - name: loadgenerator-config
    literals:
      - USERS=5
    # The base labels do not reach resources generated here: same set, by hand.
    options:
      labels:
        app.kubernetes.io/part-of: online-boutique
        app.kubernetes.io/managed-by: argocd
        platform.example.com/owner: team-boutique

# No "replicas:" for the frontend on purpose: the HPA owns the replica count
# (minReplicas: 2). Declaring it here too would make Argo CD and the HPA fight.

patches:
  # The HPA computes utilization against the CPU *request*: restore a
  # realistic request for the frontend (kind-sizing lowers it to 20m).
  - target:
      kind: Deployment
      name: frontend
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
  # Strategic merge: env entries are matched by name (index-based JSON
  # patches silently hit the wrong variable if upstream reorders env).
  # value: null drops the upstream literal, so only valueFrom is left.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
      spec:
        template:
          spec:
            containers:
              - name: main
                env:
                  - name: USERS
                    value: null
                    valueFrom:
                      configMapKeyRef:
                        name: loadgenerator-config
                        key: USERS
