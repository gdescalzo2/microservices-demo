# Single public entry point: shared Gateway (gateway-infra) -> frontend:80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend
spec:
  parentRefs:
    - name: boutique-gateway
      namespace: gateway-infra
  hostnames:
    - boutique.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
