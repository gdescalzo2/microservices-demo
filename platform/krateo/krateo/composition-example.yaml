# What a consumer team submits (by YAML, GitOps or the Krateo portal form).
# group/version/kind are generated by core-provider from Chart.yaml
# (krateoplatformops/core-provider, internal/tools/chart/chart.go):
#   group composition.krateo.io, version "v" + version with dots -> dashes,
#   kind = Pascalize(chart name): boutique-service 0.1.0 -> v0-1-0/BoutiqueService
# Check on the cluster with:
#   kubectl get crd | grep composition.krateo.io
#   kubectl explain boutiqueservices.composition.krateo.io --recursive
apiVersion: composition.krateo.io/v0-1-0
kind: BoutiqueService
metadata:
  name: team-a-prod
  namespace: krateo-system
spec:
  service:
    name: team-a
    owner: team-a
    tier: silver
  environment: prod
  frontend:
    version: 1.1.0
  git:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
