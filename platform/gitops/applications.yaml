# Argo CD Applications. Git is the source of truth: a commit on main is a
# release; a revert is a rollback.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
    path: platform/addons/config
  destination:
    server: https://kubernetes.default.svc
    # Required: Argo CD checks it against the AppProject destinations, and an
    # empty namespace matches none of them (InvalidSpecError). It is only the
    # default for namespaced resources without one: every namespaced resource
    # in platform/addons/config sets its namespace explicitly.
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev
  namespace: argocd
  labels:
    platform.example.com/environment: dev
spec:
  project: boutique
  source:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
    path: platform/deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-dev
  syncPolicy:
    automated:
      prune: true
      # DEV: no self-heal on purpose. Manual changes (troubleshooting, chaos
      # scenarios) stay in place and show up as "OutOfSync" until resynced.
      selfHeal: false
    syncOptions:
      - PruneLast=true
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-prod
  namespace: argocd
  labels:
    platform.example.com/environment: prod
spec:
  project: boutique
  source:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
    path: platform/deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-prod
  syncPolicy:
    automated:
      prune: true
      # PROD: any manual drift (kubectl edit/scale/set image) is reverted.
      selfHeal: true
    syncOptions:
      - PruneLast=true
  revisionHistoryLimit: 10
