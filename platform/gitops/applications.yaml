# Argo CD Applications. Git is the source of truth: a commit on main is a
# release; a revert is a rollback.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-config
  namespace: argocd
spec:
  project: platform
  source:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
    path: platform/addons/config
  destination:
    server: https://kubernetes.default.svc
    # Required: Argo CD checks it against the AppProject destinations, and an
    # empty namespace matches none of them (InvalidSpecError). It is only the
    # default for namespaced resources without one: every namespaced resource
    # in platform/addons/config sets its namespace explicitly.
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Retry failed syncs: a sync fails outright if the Argo CD repo-server is
    # briefly unavailable (seen for real during a release: repo-server killed
    # by its liveness probe while the image was built on the host, most likely
    # CPU starvation, not measured). Backoff 5s,10s,20s,40s,80s (155s in all)
    # plus the attempts themselves: measured on this VM, a failed attempt
    # ~24s and a full sync of dev ~2m40s with a cold repo-server, so the worst
    # case is ~7 min; release.sh/rollback.sh wait 600s. Same revision on
    # retry (refresh: false): the release is that exact commit.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-dev
  namespace: argocd
  labels:
    platform.example.com/environment: dev
spec:
  project: boutique
  source:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
    path: platform/deploy/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-dev
  syncPolicy:
    automated:
      prune: true
      # DEV: no self-heal on purpose. Manual changes (troubleshooting, chaos
      # scenarios) stay in place and show up as "OutOfSync" until resynced.
      selfHeal: false
    # Retry failed syncs: a sync fails outright if the Argo CD repo-server is
    # briefly unavailable (seen for real during a release: repo-server killed
    # by its liveness probe while the image was built on the host, most likely
    # CPU starvation, not measured). Backoff 5s,10s,20s,40s,80s (155s in all)
    # plus the attempts themselves: measured on this VM, a failed attempt
    # ~24s and a full sync of dev ~2m40s with a cold repo-server, so the worst
    # case is ~7 min; release.sh/rollback.sh wait 600s. Same revision on
    # retry (refresh: false): the release is that exact commit.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PruneLast=true
  revisionHistoryLimit: 10
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-prod
  namespace: argocd
  labels:
    platform.example.com/environment: prod
spec:
  project: boutique
  source:
    repoURL: https://github.com/gdescalzo2/microservices-demo.git
    targetRevision: main
    path: platform/deploy/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-prod
  syncPolicy:
    automated:
      prune: true
      # PROD: any manual drift (kubectl edit/scale/set image) is reverted.
      selfHeal: true
    # Retry failed syncs: a sync fails outright if the Argo CD repo-server is
    # briefly unavailable (seen for real during a release: repo-server killed
    # by its liveness probe while the image was built on the host, most likely
    # CPU starvation, not measured). Backoff 5s,10s,20s,40s,80s (155s in all)
    # plus the attempts themselves: measured on this VM, a failed attempt
    # ~24s and a full sync of dev ~2m40s with a cold repo-server, so the worst
    # case is ~7 min; release.sh/rollback.sh wait 600s. Same revision on
    # retry (refresh: false): the release is that exact commit.
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - PruneLast=true
  revisionHistoryLimit: 10
