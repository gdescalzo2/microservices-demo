# Lean monitoring stack for a 10 GB / 4 vCPU VM.
alertmanager:
  enabled: false          # alerts are inspected in the Prometheus UI (/alerts)

defaultRules:
  disabled:
    # Always firing without Alertmanager (a deliberate choice above): noise
    # that would sit red on the /alerts page during the demo.
    PrometheusNotConnectedToAlertmanagers: true

grafana:
  # adminPassword is generated by bootstrap.sh and passed with --set
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      alertmanager:
        enabled: false    # Alertmanager is disabled: the datasource would point nowhere
  # Only the Prometheus datasource is used. Grafana 13 registers ~20 bundled
  # plugins at start (~45s) and runs most datasources as separate backend
  # processes: disabling the unused ones cuts startup CPU and memory.
  grafana.ini:
    plugins:
      preinstall_disabled: true
      disable_plugins: "cloudwatch,elasticsearch,grafana-postgresql-datasource,grafana-pyroscope-datasource,influxdb,jaeger,loki,mssql,mysql,opentsdb,stackdriver,tempo,zipkin,grafana-pyroscope-app,grafana-lokiexplore-app,grafana-exploretraces-app,grafana-advisor-app"
  # Grafana 13 sits at ~250Mi during first start: with a 256Mi limit the Go GC
  # thrashes (2+ CPU), startup exceeds the liveness window and the pod loops.
  # Measured ~465Mi steady with all bundled plugins: 640Mi leaves headroom.
  resources:
    requests: {cpu: 20m, memory: 256Mi}
    limits: {memory: 640Mi}

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors / PrometheusRules from every namespace,
    # not only those labelled with the Helm release name.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
    retention: 2d
    resources:
      requests: {cpu: 100m, memory: 400Mi}
      limits: {memory: 1Gi}

# Control-plane components are not reachable as scrape targets in kind:
# disabling them avoids permanently-firing "TargetDown" alerts.
kubeEtcd: {enabled: false}
kubeScheduler: {enabled: false}
kubeControllerManager: {enabled: false}
kubeProxy: {enabled: false}

prometheusOperator:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
