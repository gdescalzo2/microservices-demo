# Single replica of each controller: enough for a demo cluster.
admissionController:
  replicas: 1
backgroundController:
  replicas: 1
reportsController:
  replicas: 1
  # Measured: the reports controller used ~1.8 CPU after each start, the node
  # sat at 2.92 of its 3-CPU cap, and the controller logged "Failed to renew
  # lease ... context deadline exceeded", lost leadership and restarted
  # (5 times in 10 min). Most likely its start-up scan slowed the API server
  # enough to miss the renewal. With this limit: 0 restarts, scan in ~40s.
  # Memory measured at 81-88Mi against the 128Mi default.
  resources:
    requests: {cpu: 100m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
cleanupController:
  enabled: false
