# Audit only. Expected finding: upstream "loadgenerator" has no probes
# (it is a load client, not a server): a conscious, documented exception.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-probes
  annotations:
    policies.kyverno.io/title: Require readiness and liveness probes
    policies.kyverno.io/category: Best Practices
spec:
  validationActions: [Audit]
  evaluation:
    background:
      enabled: true
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets]
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
    namespaceSelector:
      matchExpressions:
        - key: platform.example.com/environment
          operator: Exists
  validations:
    - expression: >-
        object.spec.containers.all(c,
          has(c.readinessProbe) && has(c.livenessProbe))
      message: "Containers should define readiness and liveness probes."
