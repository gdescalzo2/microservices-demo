# Every workload must declare its owning team: needed for alert routing,
# cost allocation (FinOps) and catalog ownership (e.g. Krateo).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-owner-label
  annotations:
    policies.kyverno.io/title: Require owner label
    policies.kyverno.io/category: Governance
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments]
    namespaceSelector:
      matchExpressions:
        - key: platform.example.com/environment
          operator: Exists
  validations:
    - expression: >-
        has(object.metadata.labels) &&
        'platform.example.com/owner' in object.metadata.labels &&
        object.metadata.labels['platform.example.com/owner'] != ''
      message: "Deployments must have the label 'platform.example.com/owner'."
